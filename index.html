.btn{width:100%;border:0;border-radius:14px;padding:13px 14px;font-weight:800;font-size:15px;margin-top:9px;background:var(--green);color:#fff}.btn.alt{background:var(--light);color:var(--green)}.btn.small{width:auto;padding:8px 10px;margin:0}
.row{display:flex;gap:8px;align-items:center}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.small{font-size:13px}.tiny{font-size:12px}
.item{padding:12px 0;border-bottom:1px solid #eee}.item:last-child{border:0}.item strong{display:block}
.check{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid #eee}.check input{width:21px;height:21px}.day{cursor:pointer}
.step{display:flex;gap:12px;margin:14px 0}.num{min-width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--green);color:#fff;font-weight:800}
input,select{width:100%;border:1px solid #d8ddd9;border-radius:12px;padding:11px;background:#fff;font:inherit}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.product{border:1px solid #edf0ed;border-radius:16px;padding:13px;margin:9px 0}.product .qty{font-weight:800;color:var(--green)}
.notice{background:var(--warn);border-radius:14px;padding:11px;margin:10px 0}.pill{border-radius:999px;background:#eef3ef;padding:5px 8px;font-size:12px}
footer{position:fixed;bottom:0;left:0;right:0;text-align:center;padding:9px;background:#f4f6f1;color:var(--muted);font-size:12px}
@media(max-width:600px){
 header{padding:20px 20px 8px}

 #cloudstatus{min-width:0;overflow-wrap:anywhere}
}

async function initCloud(){
  try{
    const {data:{session}}=await sb.auth.getSession();
    cloudUser=session?.user||null;
    sb.auth.onAuthStateChange((_e,s)=>{cloudUser=s?.user||null; updateCloudBar(); if(cloudUser) syncFromCloud();});
    updateCloudBar();
    if(cloudUser) await syncFromCloud();
  }catch(e){document.getElementById('cloudstatus').textContent='☁️ Lokal aktiv · Cloud derzeit nicht erreichbar';}
}
function updateCloudBar(){
  const s=document.getElementById('cloudstatus'),b=document.getElementById('cloudbtn'); if(!s||!b)return;
  if(cloudUser){s.textContent='☁️ Synchronisiert · '+(cloudUser.email||'angemeldet');b.textContent='Abmelden';b.style.display='inline-block';}
  else{s.textContent='📱 Lokal gespeichert · für Geräte-Sync anmelden';b.textContent='Anmelden';b.style.display='inline-block';}
}
async function cloudAction(){
  if(cloudUser){await sb.auth.signOut();return;}
  const email=prompt('E-Mail-Adresse für deinen Essensplan:'); if(!email)return;
  const password=prompt('Passwort (mindestens 6 Zeichen):'); if(!password)return;
  let {data,error}=await sb.auth.signInWithPassword({email,password});
  if(error){
    const create=confirm('Anmeldung nicht möglich. Soll mit dieser E-Mail ein neues Konto angelegt werden?');
    if(!create)return;
    const r=await sb.auth.signUp({email,password,options:{emailRedirectTo:location.origin}});
    if(r.error){alert('Konto konnte nicht angelegt werden: '+r.error.message);return;}
    if(!r.data.session){alert('Konto angelegt. Bitte bestätige die E-Mail von Supabase und melde dich danach hier an.');return;}
  }
}
async function syncFromCloud(){
  if(!cloudUser||cloudBusy)return; cloudBusy=true;
  try{
    const {data,error}=await sb.from('inventory').select('product_key,quantity,unit').eq('user_id',cloudUser.id);
    if(error)throw error;
    if(data&&data.length){
      data.forEach(x=>inventory[x.product_key]=+x.quantity);
      localStorage.inventoryV2=JSON.stringify(inventory);
    }else{
      await syncInventoryToCloud();
    }
    const {data:cp}=await sb.from('user_products').select('product_key,name,package_size,unit,storage').eq('user_id',cloudUser.id);
    if(cp&&cp.length){
      const known=new Set(customProducts.map(x=>x.id));
      cp.forEach(x=>{if(x.product_key&&!known.has(x.product_key))customProducts.push({id:x.product_key,name:x.name,pack:+x.package_size,unit:x.unit,type:x.storage||'Vorrat'});});
      localStorage.customProducts=JSON.stringify(customProducts);
    }else if(customProducts.length){await syncCustomProductsToCloud();}
    render(); updateCloudBar();
  }catch(e){document.getElementById('cloudstatus').textContent='⚠️ Lokal aktiv · Cloud-Sync fehlgeschlagen';}
  finally{cloudBusy=false;}
}
async function syncInventoryToCloud(){
  if(!cloudUser)return;
  const rows=Object.entries(inventory).map(([id,q])=>({user_id:cloudUser.id,product_key:id,quantity:+q,unit:P(id)?.unit||'Stück'}));
  if(rows.length) await sb.from('inventory').upsert(rows,{onConflict:'user_id,product_key'});
}
async function syncOneInventory(id){
  if(!cloudUser)return; const p=P(id);
  await sb.from('inventory').upsert({user_id:cloudUser.id,product_key:id,quantity:have(id),unit:p?.unit||'Stück'},{onConflict:'user_id,product_key'});
}
async function syncCustomProductsToCloud(){
  if(!cloudUser||!customProducts.length)return;
  await sb.from('user_products').upsert(customProducts.map(p=>({user_id:cloudUser.id,product_key:p.id,name:p.name,package_size:p.pack,unit:p.unit,storage:p.type})),{onConflict:'user_id,product_key'});
}
function germanyNow(){
  const parts=new Intl.DateTimeFormat('de-DE',{
    timeZone:'Europe/Berlin',
    weekday:'short',hour:'2-digit',minute:'2-digit',hour12:false
  }).formatToParts(new Date());
  const get=t=>parts.find(x=>x.type===t)?.value||'';
  const map={Mo:0,Di:1,Mi:2,Do:3,Fr:4,Sa:5,So:6};
  return {day:map[get('weekday')] ?? 0,time:get('hour')+':'+get('minute'),hour:+get('hour')};
}

function P(id){return productsAll().find(x=>x.id===id)}
function have(id){return +(inventory[id]||0)}
function fmt(n){return Math.round(n*10)/10}
function packCount(id,needed){let p=P(id), missing=Math.max(0,needed-have(id)); return missing?Math.ceil(missing/p.pack):0}

function shoppingForDay(dayIndex){
 const req={};
 const add=(id,n)=>req[id]=(req[id]||0)+n;
 lightMealNeeds[dayIndex].breakfast.forEach(([id,n])=>add(id,n));
 meals[dayIndex].needs.forEach(([id,n])=>add(id,n));
 lightMealNeeds[dayIndex].dinner.forEach(([id,n])=>add(id,n));
 const arr=[];
 Object.entries(req).forEach(([id,need])=>{
   const p=P(id), h=have(id), missing=Math.max(0,need-h);
   if(missing>0){
     const packs=Math.ceil(missing/p.pack);
     arr.push({id,name:p.name,text:`${packs} × ${p.pack} ${p.unit}`,need,missing,packs,rest:fmt(packs*p.pack-missing)});
   }
 });
 // Extras from lunch remain visible as "nach Bedarf".
 meals[dayIndex].extras.forEach(x=>{const name=Array.isArray(x)?x[0]:x;const amount=Array.isArray(x)?x[1]:'Menge noch festlegen';arr.push({id:'extra:'+name,name,text:`⚠️ Nicht in Produkte gespeichert · Rezept: ${amount}`,extra:true,missingProduct:true});});
 return arr;
}
function shoppingFor(m){
 let arr=[];
 m.needs.forEach(([id,need])=>{let p=P(id),h=have(id),missing=Math.max(0,need-h),packs=packCount(id,need);
   if(missing>0) arr.push({id,name:p.name,text:`${packs} × ${p.pack} ${p.unit}`,need,missing,packs,rest:fmt(packs*p.pack-missing)});
 });
 m.extras.forEach(x=>{const name=Array.isArray(x)?x[0]:x;const amount=Array.isArray(x)?x[1]:'Menge noch festlegen';arr.push({id:'extra:'+name,name,text:`⚠️ Nicht in Produkte gespeichert · Rezept: ${amount}`,extra:true,missingProduct:true});});
 return arr;
}
function nav(v){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x.dataset.v===v));document.getElementById(v).classList.add('active');render()}
tabs.onclick=e=>{if(e.target.dataset.v)nav(e.target.dataset.v)}
function selectDay(i){selected=i;localStorage.selectedDayV2=i;nav('today')}
function addInv(id,amount){inventory[id]=Math.max(0,fmt(have(id)+(+amount||0)));localStorage.inventoryV2=JSON.stringify(inventory);render();syncOneInventory(id)}
function setInv(id,amount){inventory[id]=Math.max(0,+amount||0);localStorage.inventoryV2=JSON.stringify(inventory);render();syncOneInventory(id)}
function buyItem(id,packs){let p=P(id);addInv(id,p.pack*packs)}
function useMeal(){
 let m=meals[selected]; m.needs.forEach(([id,n])=>setInv(id,Math.max(0,have(id)-n))); alert('Verbrauch wurde aus dem Vorrat abgezogen. Restmengen kannst du im Vorrat korrigieren.');
}
function toggleCheck(k,v){checked[k]=v;localStorage.checkedV2=JSON.stringify(checked)}
function addProduct(){
 let name=document.getElementById('pn').value.trim(),pack=+document.getElementById('pp').value,unit=document.getElementById('pu').value,type=document.getElementById('pt').value;
 if(!name||!pack)return alert('Bitte Produktname und Packungsgröße eingeben.');
 let id='custom'+Date.now();customProducts.push({id,name,pack,unit,type});localStorage.customProducts=JSON.stringify(customProducts);render();syncCustomProductsToCloud();
}
function render(){
 const n=germanyNow();
 const todayName=meals[n.day].day;
 const planLabel=(selected===n.day?'Heute':selected===(n.day+1)%7?'Morgen':meals[selected].day);
 document.getElementById('clockline').textContent=`Deutschland · ${todayName}, ${n.time} Uhr · Planung: ${planLabel}`;
 let m=meals[selected], shoplist=shoppingForDay(selected);
 const dm=dayMeals[selected];
 const dayTotal=dm.breakfast.kcal+m.kcal+dm.dinner.kcal;
 today.innerHTML=`<div class="card hero"><div class="muted">${m.day} · Tagesplan</div><h2>≈ ${dayTotal} kcal geplant</h2><span class="badge">Frühstück</span><span class="badge">Hauptmahlzeit</span><span class="badge">Abendessen</span></div>
 <div class="card"><div class="tiny muted">VORMITTAG / FRÜHSTÜCK</div><h3>${dm.breakfast.name}</h3><div><span class="badge">≈ ${dm.breakfast.kcal} kcal</span><span class="badge">⏱ ${dm.breakfast.time}</span></div><p class="small">${dm.breakfast.items.join(' · ')}</p></div>
 <div class="card"><div class="tiny muted">CA. 15 UHR · HAUPTMAHLZEIT</div><h3>${m.name}</h3><div><span class="badge">≈ ${m.kcal} kcal</span><span class="badge">⏱ ${m.time}</span><span class="badge">${m.device}</span></div></div>
 <div class="card"><div class="tiny muted">ABENDS</div><h3>${dm.dinner.name}</h3><div><span class="badge">≈ ${dm.dinner.kcal} kcal</span><span class="badge">⏱ ${dm.dinner.time}</span></div><p class="small">${dm.dinner.items.join(' · ')}</p></div>
 <div class="card"><h3>Für den ganzen Tag kaufen</h3>${shoplist.slice(0,5).map(x=>`<div class="item"><strong>${x.name}</strong><span class="qty">${x.text}</span>${x.rest>0?`<div class="tiny muted">Rechnerischer Packungsrest nach dem Rezept: ${x.rest} ${P(x.id).unit}</div>`:''}</div>`).join('')||'<p>Die Hauptzutaten sind bereits im Vorrat.</p>'}
 <button class="btn" onclick="nav('shop')">🛒 Einkauf öffnen</button><button class="btn alt" onclick="nav('cook')">👨‍🍳 Jetzt kochen</button></div>
 ${n.hour>=19 && selected===n.day?`<div class="notice small"><strong>Für heute ist es schon spät.</strong> Der heutige Plan bleibt erreichbar. Für deinen normalen Einkauf kannst du direkt morgen öffnen.<button class="btn alt" onclick="selectDay(${(n.day+1)%7})">Morgen (${meals[(n.day+1)%7].day}) planen</button></div>`:''}
 <div class="notice small">Die App rechnet mit echten Packungsgrößen. Nach dem Kochen bestätigst du den Verbrauch; Restmengen kannst du im Vorrat jederzeit korrigieren.</div>`;
 shop.innerHTML=`<div class="card"><h2>🛒 ${m.day} bei REWE</h2><p class="muted">Frühstück + Hauptmahlzeit + Abendessen. Vorrat wird automatisch berücksichtigt.</p>${shoplist.map((x,i)=>`<label class="check"><input type="checkbox" ${checked[m.day+i]?'checked':''} onchange="toggleCheck('${m.day+i}',this.checked)"><span><strong>${x.name}</strong><br><span class="small">${x.text}${x.missing?` · Rezept benötigt noch ${x.missing} ${P(x.id).unit}`:''}</span>${!x.extra?`<br><button type="button" class="btn small alt" onclick="event.preventDefault();buyItem('${x.id}',${x.packs})">Als gekauft einbuchen</button>`:''}</span></label>`).join('')||'<p>Für die hinterlegten Hauptzutaten musst du nichts kaufen.</p>'}</div>`;
 cook.innerHTML=`<div class="card"><span class="badge">${m.device}</span><h2>${m.name}</h2>${m.steps.map((s,i)=>`<div class="step"><div class="num">${i+1}</div><div>${s}</div></div>`).join('')}<button class="btn" onclick="useMeal()">✓ Gericht gekocht – Zutaten verbrauchen</button></div>`;
 week.innerHTML=`<div class="card"><h2>Wochenplan</h2>${meals.map((x,i)=>{const d=dayMeals[i];return `<div class="product day" onclick="selectDay(${i})"><span class="tiny muted">${x.day}</span><strong>🥣 ${d.breakfast.name}</strong><div class="small">🍽️ ${x.name}</div><div class="small">🌙 ${d.dinner.name}</div><div class="tiny muted" style="margin-top:5px">≈ ${d.breakfast.kcal+x.kcal+d.dinner.kcal} kcal gesamt</div></div>`}).join('')}</div>`;
 stock.innerHTML=`<div class="card"><h2>🏠 Mein Vorrat</h2><p class="muted">Hier zählt die tatsächlich noch vorhandene Menge.</p>${productsAll().map(p=>`<div class="product"><div class="between row"><div><strong>${p.name}</strong><div class="tiny muted">${p.type} · Packung ${p.pack} ${p.unit}</div></div><span class="pill">${fmt(have(p.id))} ${p.unit}</span></div><div class="grid2" style="margin-top:9px"><button class="btn alt" onclick="addInv('${p.id}',${p.pack})">+ 1 Packung</button><input inputmode="decimal" value="${fmt(have(p.id))}" onchange="setInv('${p.id}',this.value)" aria-label="Bestand"></div></div>`).join('')}</div>`;
 products.innerHTML=`<div class="card"><h2>❤️ Meine Produkte</h2><p class="muted">Startbestand aus deinen REWE-Favoriten. Fehlende Produkte kannst du jederzeit ergänzen.</p>${productsAll().map(p=>`<div class="item"><strong>${p.name}</strong><span class="small">${p.pack} ${p.unit} · ${p.type}</span></div>`).join('')}</div>
 <div class="card"><h3>➕ Produkt hinzufügen</h3><input id="pn" placeholder="z. B. Polenta"><div class="grid2" style="margin-top:8px"><input id="pp" type="number" placeholder="Packungsgröße"><select id="pu"><option>g</option><option>ml</option><option>Stück</option></select></div><select id="pt" style="margin-top:8px"><option>Vorrat</option><option>Kühlschrank</option><option>TK</option><option>frisch</option></select><button class="btn" onclick="addProduct()">Produkt speichern</button></div>`;
}
render();initCloud();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
</script></body></html>
